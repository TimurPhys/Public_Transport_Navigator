<style>
  /* Основной контейнер sidebar */
  .offcanvas-start {
    width: 40% !important;
    height: 100vh !important;
    display: flex !important;
    flex-direction: column !important;
    overflow: hidden !important; /* Блокируем общий скролл сайдбара */
  }

  #sidebar {
    width: 30%;
    min-width: 350px; /* Чтобы контент не сплющило */
    height: 100vh;
    background: white;
    border-right: 1px solid #ddd;

    /* Анимация перехода */
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex-shrink: 0; /* Важно: чтобы карта его не сдавливала */
  }
  #sidebar.component-hidden {
    width: 0;
    min-width: 0;
    border-right: none;
    /* Дополнительно можно чуть сдвинуть контент внутри */
    transform: translateX(-20px);
    opacity: 0;
  }
  #sidebar.component-active {
    width: 30%;
    opacity: 1;
    transform: translateX(0);
  }

  /* Контейнер, куда вставляется ваш шаблон из JS */
  #routesList,
  #scheduleBlock {
    width: 100%;
    height: 100%;
    transition:
      opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1),
      transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: absolute;
    top: 0;
    left: 0;

    display: flex;
    flex-direction: column;
  }

  /* Состояние: Виден */
  /* .component-active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: all;
    z-index: 2;
  } */

  /* Состояние: Скрыт (улетает влево или вправо) */
  /* .component-hidden {
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  } */

  #routesList.component-hidden {
    transform: translateX(-30px); /* Уходит влево */
  }

  #scheduleBlock.component-hidden {
    transform: translateX(30px); /* Уходит вправо */
  }

  /* Внутренние списки маршрутов (те самые .list-group-scroll) */
  .route-list-scroll {
    overflow-y: auto !important;
    max-height: 100%; /* Добавьте это */
    display: block; /* И это */
    scrollbar-width: thin; /* Тонкий скролл для Firefox */
  }

  /* На телефонах пусть занимает всю ширину */
  @media (max-width: 1000px) {
    .offcanvas-start {
      width: 100% !important;
    }
  }
</style>

<div id="sidebar" class="component-hidden">
  <div id="routesList"></div>
  <div id="scheduleBlock"></div>
</div>
