<style>
  /* Основной контейнер sidebar */
  .offcanvas-start {
    width: 40% !important;
    height: 100vh !important;
    display: flex !important;
    flex-direction: column !important;
    overflow: hidden !important; /* Блокируем общий скролл сайдбара */
  }

  /* Контейнер, куда вставляется ваш шаблон из JS */
  #routesList,
  #scheduleBlock {
    width: 100%;
    height: 100%;
    transition:
      opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1),
      transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: absolute; /* Накладываем их друг на друга */
    top: 0;
    left: 0;

    display: flex;
    flex-direction: column;
  }

  /* Состояние: Виден */
  .component-active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: all;
    z-index: 2;
  }

  /* Состояние: Скрыт (улетает влево или вправо) */
  .component-hidden {
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  }

  #routesList.component-hidden {
    transform: translateX(-30px); /* Уходит влево */
  }

  #scheduleBlock.component-hidden {
    transform: translateX(30px); /* Уходит вправо */
  }

  /* Внутренние списки маршрутов (те самые .list-group-scroll) */
  .route-list-scroll {
    overflow-y: auto !important;
    max-height: 100%; /* Добавьте это */
    display: block; /* И это */
    scrollbar-width: thin; /* Тонкий скролл для Firefox */
  }

  /* На телефонах пусть занимает всю ширину */
  @media (max-width: 1000px) {
    .offcanvas-start {
      width: 100% !important;
    }
  }
</style>

<div
  class="offcanvas offcanvas-start"
  tabindex="-1"
  data-bs-backdrop="true"
  id="offcanvas"
  aria-labelledby="offcanvasLabel"
>
  <div id="routesList"></div>
  <div id="scheduleBlock"></div>
</div>
